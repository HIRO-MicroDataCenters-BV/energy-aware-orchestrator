apiVersion: v1
kind: Service
metadata:
  name: workload-type-2-service
  namespace: workspace
  labels:
    app: workload-type-2
    component: workload
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: workload-type-2

---
apiVersion: v1
kind: Service
metadata:
  name: workload-type-2-nodeport
  namespace: workspace
  labels:
    app: workload-type-2
    component: workload
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 32002  # External access for testing
  selector:
    app: workload-type-2
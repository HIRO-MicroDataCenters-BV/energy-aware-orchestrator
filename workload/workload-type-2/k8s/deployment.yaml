apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-type-2
  namespace: workspace
  labels:
    app: workload-type-2
    component: workload
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-type-2
  template:
    metadata:
      labels:
        app: workload-type-2
        component: workload
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: workload-type-2
        image: hiroregistry/shift2dc:workload-type-2-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"  # Increased for baseline memory usage
            cpu: "100m"
          limits:
            memory: "4Gi"    # Increased to accommodate memory-intensive operations
            cpu: "2000m"     # Allow up to 2 CPU cores during heavy computation
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
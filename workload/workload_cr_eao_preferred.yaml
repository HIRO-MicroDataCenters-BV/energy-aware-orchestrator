---
apiVersion: eas.hiro.io/v1
kind: EnergyAwareOrchestration
metadata:
  name: ml-training-job
  namespace: default
spec:
  priority: Preferred      # Business priority (Critical, Preferred, Optional)
  forecastWindowDays: 7    # Forecast schedule for the next 7 days
  energyConsumption: 500   # Estimated energy consumption in kWh

  # Reference to the application/workload
  applicationRef:
    name: ml-training-deployment
    namespace: default
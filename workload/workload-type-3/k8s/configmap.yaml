apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-type-3-config
  namespace: workspace
  labels:
    app: workload-type-3
    component: workload
data:
  # Cycle configuration
  active_duration_minutes: "20"    # 20 minutes of activity
  idle_duration_minutes: "60"      # 1 hour of idle time
  min_intensity: "0.3"             # Minimum random intensity
  max_intensity: "1.0"             # Maximum random intensity
  # Logging configuration
  log_level: "INFO"
  # Resource configuration
  max_cpu_cores: "0"               # 0 = use all available cores
  enable_random_workers: "true"    # Use random number of worker processes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-type-3
  namespace: workspace
  labels:
    app: workload-type-3
    component: workload
    type: random-burst-workload
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-type-3
  template:
    metadata:
      labels:
        app: workload-type-3
        component: workload
        type: random-burst-workload
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
        # Annotations for energy monitoring
        energy.monitoring/track: "true"
        energy.monitoring/type: "random-burst-workload"
        energy.monitoring/pattern: "20min-active-60min-idle"
    spec:
      containers:
      - name: workload-type-3
        image: hiroregistry/shift2dc:workload-type-3-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
          name: http
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: workload-type-3-config
              key: log_level
        - name: TZ
          value: "UTC"
        resources:
          requests:
            memory: "256Mi"    # Lower baseline for random workload
            cpu: "50m"         # Lower baseline CPU request
          limits:
            memory: "6Gi"      # High limit for random bursts
            cpu: "3000m"       # Allow up to 3 CPU cores during active phases
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 1Gi
      restartPolicy: Always
      terminationGracePeriodSeconds: 180  # 3 minutes for graceful shutdown
      securityContext:
        fsGroup: 1000
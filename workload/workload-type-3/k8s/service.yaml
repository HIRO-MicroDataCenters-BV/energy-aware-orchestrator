apiVersion: v1
kind: Service
metadata:
  name: workload-type-3-service
  namespace: workspace
  labels:
    app: workload-type-3
    component: workload
    type: random-burst-workload
spec:
  type: NodePort
  ports:
  - port: 8002
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 32004  # Different port from other workload apps
  selector:
    app: workload-type-3
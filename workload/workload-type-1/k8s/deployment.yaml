apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-type-1
  namespace: workspace
  labels:
    app: workload-type-1
    component: workload
    type: scheduled-workload
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-type-1
  template:
    metadata:
      labels:
        app: workload-type-1
        component: workload
        type: scheduled-workload
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
        # Annotations for energy monitoring
        energy.monitoring/track: "true"
        energy.monitoring/type: "scheduled-workload"
    spec:
      containers:
      - name: workload-type-1
        image: hiroregistry/shift2dc:workload-type-1-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: workload-type-1-config
              key: log_level
        - name: TZ
          value: "UTC"
        resources:
          requests:
            memory: "1Gi"      # Higher baseline for extended operations
            cpu: "200m"        # Higher baseline CPU request
          limits:
            memory: "8Gi"      # High limit for sustained memory operations
            cpu: "4000m"       # Allow up to 4 CPU cores during computation
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 2Gi
      restartPolicy: Always
      terminationGracePeriodSeconds: 300  # 5 minutes for graceful shutdown
      securityContext:
        fsGroup: 1000
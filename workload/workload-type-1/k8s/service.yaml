apiVersion: v1
kind: Service
metadata:
  name: workload-type-1-service
  namespace: workspace
  labels:
    app: workload-type-1
    component: workload
    type: scheduled-workload
spec:
  type: NodePort
  ports:
  - port: 8001
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 32003  # Different port from original workload app
  selector:
    app: workload-type-1
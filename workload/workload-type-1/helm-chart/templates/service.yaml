apiVersion: v1
kind: Service
metadata:
  name: {{ include "workload-type-1.fullname" . }}-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workload-type-1.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: {{ .Values.service.name }}
    {{- if eq .Values.service.type "NodePort" }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  selector:
    {{- include "workload-type-1.selectorLabels" . | nindent 4 }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    name: {{ .Values.namespace }}
    component: {{ .Values.labels.component }}
    purpose: energy-monitoring-workloads
  annotations:
    description: "Shared namespace for all workload applications (type-1, type-2, type-3)"
    energy.monitoring/track: "true"
    energy.monitoring/workspace: "true"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workload-type-1.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workload-type-1.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "workload-type-1.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workload-type-1.selectorLabels" . | nindent 8 }}
        component: {{ .Values.labels.component }}
        type: {{ .Values.labels.type }}
        version: {{ .Values.labels.version }}
      annotations:
        {{- with .Values.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: {{ .Values.service.name }}
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: {{ .Values.env.PYTHONUNBUFFERED | quote }}
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "workload-type-1.fullname" . }}-config
              key: log_level
        - name: TZ
          value: {{ .Values.env.TZ | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        {{- if .Values.volumes.tmp.enabled }}
        - name: tmp-volume
          mountPath: /tmp
        {{- end }}
      volumes:
      {{- if .Values.volumes.tmp.enabled }}
      - name: tmp-volume
        emptyDir:
          sizeLimit: {{ .Values.volumes.tmp.sizeLimit }}
      {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
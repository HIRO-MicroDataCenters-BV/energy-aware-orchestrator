apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: energyawareorchestrations.eas.hiro.io
spec:
  group: eas.hiro.io
  scope: Namespaced
  names:
    kind: EnergyAwareOrchestration
    plural: energyawareorchestrations
    singular: energyawareorchestration
    shortNames:
    - eao
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: Energy-aware orchestration schedule application.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            description: Spec for EnergyAwareOrchestration resource.
            properties:
              energyConsumption:
                type: integer
                description: Estimated energy consumption (arbitrary units, e.g. kWh)
                minimum: 0
              forecastWindowDays:
                type: integer
                description: Number of days to forecast the execution schedule for.
                minimum: 1
                maximum: 30
              priority:
                type: string
                description: Priority levels for workload scheduling.
                enum:
                - Critical
                - NonCritical
                - Optional
              applicationRef:
                type: object
                description: Reference to the application.
                properties:
                  name:
                    type: string
                    description: Name of the application
                  namespace:
                    description: Target namespace for the application
                required:
                - name
            required:
            - energyConsumption
            - forecastWindowDays
            - applicationRef
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true

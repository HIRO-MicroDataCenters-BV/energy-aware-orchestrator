apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: energyawareorchestrations.eas.hiro.io
spec:
  group: eas.hiro.io
  scope: Namespaced
  names:
    kind: EnergyAwareOrchestration
    plural: energyawareorchestrations
    singular: energyawareorchestration
    shortNames:
      - eao
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Energy-aware orchestration schedule application.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                energyConsumption:
                  type: integer
                  format: int64
                  description: >
                    Estimated energy consumption (arbitrary units, e.g. kWh)
                  minimum: 0
                forecastWindowDays:
                  type: integer
                  format: int32
                  description: Number of days to forecast the execution schedule for.
                  minimum: 1
                  maximum: 30
                priority:
                  type: string
                  description: >
                    Business priority of the workload. Used for scheduling and
                    cost/energy optimisation.
                  enum:
                    - Critical
                    - NonCritical
                    - Optional
                applicationRef:
                  type: object
                  description: Reference to the application
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: Name of the application
                    namespace:
                      type: string
                      description: Target namespace for the application
            status:
              type: object
              properties:
                executionSchedule:
                  type: object
                  description: Computed execution schedule and last update timestamp.
                  properties:
                    updated:
                      type: string
                      format: date-time
                      description: UTC timestamp of the last schedule computation.
                    schedule:
                      type: array
                      description: List of per-day schedules.
                      items:
                        type: object
                        required:
                          - date
                          - times
                        properties:
                          date:
                            type: string
                            format: date
                          times:
                            type: array
                            items:
                              type: object
                              required:
                                - start
                                - stop
                                - cost
                              properties:
                                start:
                                  type: string
                                  pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$"
                                stop:
                                  type: string
                                  pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$"
                                cost:
                                  type: number
                                  format: double
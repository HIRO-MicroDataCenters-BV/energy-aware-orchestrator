apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-aware-orchestrator
  namespace: default
  labels:
    app: energy-aware-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energy-aware-orchestrator
  template:
    metadata:
      labels:
        app: energy-aware-orchestrator
    spec:
      serviceAccountName: energy-aware-orchestrator
      containers:
        - name: operator
          # Replace this with the actual image you build & push.
          image: your-registry/energy-aware-orchestrator:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - kopf
            - run
            - -A
            - /app/energy_orchestrator/operator.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"




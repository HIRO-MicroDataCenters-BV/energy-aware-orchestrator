[project]
name = "energy-aware-operator"
version = "0.1.0"
description = "Kubernetes operator for energy-aware orchestration"
requires-python = ">=3.11"
dependencies = [
    "kopf>=1.37.0",
    "kubernetes>=28.0.0",
    "pykube-ng>=23.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

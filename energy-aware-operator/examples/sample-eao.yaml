# Sample EnergyAwareOrchestration Custom Resources

## Critical Workload (Always On)
---
apiVersion: eas.hiro.io/v1
kind: EnergyAwareOrchestration
metadata:
  name: critical-api-service
  namespace: default
spec:
  # Energy consumption in Watts
  energyConsumption: 100
  
  # Forecast window (1-30 days)
  forecastWindowDays: 14
  
  # Priority: Critical, Preferred, or Optional
  priority: Critical
  
  # Application reference
  applicationRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
    namespace: production

---
## Preferred Workload (ML Training)
apiVersion: eas.hiro.io/v1
kind: EnergyAwareOrchestration
metadata:
  name: ml-training-job
  namespace: default
spec:
  energyConsumption: 500
  forecastWindowDays: 7
  priority: Preferred
  applicationRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-training-deployment
    namespace: default

---
## Optional Workload (Batch Processing)
apiVersion: eas.hiro.io/v1
kind: EnergyAwareOrchestration
metadata:
  name: batch-processing-job
  namespace: default
spec:
  energyConsumption: 200
  forecastWindowDays: 3
  priority: Optional
  applicationRef:
    apiVersion: batch/v1
    kind: Job
    name: batch-processor
    namespace: default



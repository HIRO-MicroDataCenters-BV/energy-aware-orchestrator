replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

service:
  type: ClusterIP
  # the port for the HTTP health endpoint
  port: 8080

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

configuration:
  # Operator configuration
  log_level: INFO
  
  # Re-evaluation interval in seconds
  reconcile_interval_seconds: 600
  
  # Energy API configuration
  energy_api_url: "http://energy-metric-service:8000"
  
  # CRD configuration
  api_group: "eas.hiro.io"
  api_version: "v1"
  plural: "energyawareorchestrations"

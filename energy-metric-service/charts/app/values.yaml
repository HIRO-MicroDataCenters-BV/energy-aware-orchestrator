# Energy Metric Service Application Configuration

# Database connection (must match postgres chart)
database:
  host: eao-postgres
  port: 5432
  name: orchestration_db
  username: postgres
  password: postgres

configmap:
  databaseURLConfig: orchestration-api-config

# FastAPI Application
app:
  name: energy-metric-service
  replicaCount: 1

  image:
    repository: energy-metric-service
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  # Environment variables
  env:
    # Scrapes Kepler power/utilization data via Prometheus into
    # container_power_metrics - feeds demand resolution tiers 1-2
    # (measured/ML-predicted). See PROMETHEUS_BASE_URL below for where it
    # reads from.
    ENABLE_METRICS_SCHEDULER: "false"
    ENABLE_DEPLOYMENT_SCHEDULER: "true"
    LOG_LEVEL: "INFO"
    KUBERNETES_NAMESPACE: ""  # Leave empty to use release namespace
    USE_KUBECTL_PROXY: "false"  # Use in-cluster authentication (ServiceAccount)

    # Where ENABLE_METRICS_SCHEDULER reads Kepler data from. Leave empty to
    # auto-point at the monitoring stack's Prometheus service (see
    # monitoring.releaseName below) - only set this if Prometheus lives
    # somewhere non-standard.
    PROMETHEUS_BASE_URL: ""

    # Grid capacity polling. Poller stays dormant until GRID_API_URL is set
    # to a real grid endpoint - no URL means nothing to poll. Leave empty to
    # auto-point at the dev stub below when gridStub.enabled is true.
    ENABLE_GRID_POLLING: "true"
    GRID_API_URL: ""
    GRID_POLL_INTERVAL_SECONDS: "300"

    # Supply forecasting. Runs in-process (no external service/URL needed) -
    # a harmless no-op cycle when there's no real supply history yet.
    ENABLE_FORECASTING: "true"
    FORECASTING_INTERVAL_SECONDS: "1800"

    # Deletes rows older than METRICS_RETENTION_DAYS from node_metrics and
    # container_power_metrics - both grow unbounded otherwise (a fresh row
    # every metrics-collection cycle, nothing else ever removes one). On by
    # default - this is a safety/hygiene concern, not an optional feature.
    ENABLE_METRICS_RETENTION: "true"
    METRICS_RETENTION_DAYS: "30"
    METRICS_RETENTION_INTERVAL_SECONDS: "3600"

  # Resource limits
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Dev/test-only mock grid server (see templates/grid-stub.yaml). Not for
# production - stands in for the real external grid API so grid polling can
# be exercised without one. When enabled and app.env.GRID_API_URL is empty,
# GRID_API_URL is auto-set to this stub's address.
gridStub:
  enabled: false

# Helm release name the energy-monitoring-helm-stack chart was installed
# under (see energy-monitoring-helm-stack/scripts/deploy.sh's own
# RELEASE_NAME default). Used only to auto-derive PROMETHEUS_BASE_URL above
# - change this if the monitoring stack was deployed under a different name.
monitoring:
  releaseName: energy-metrics


apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
    version: {{ .Values.app.image.tag | default "latest" }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        version: {{ .Values.app.image.tag | default "latest" }}
    spec:
      serviceAccountName: {{ .Values.app.name }}-sa
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.targetPort }}
              protocol: TCP
          env:
            # Database connection
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.database.username }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            
            # Application settings
            - name: ENABLE_METRICS_SCHEDULER
              value: "{{ .Values.app.env.ENABLE_METRICS_SCHEDULER }}"
            {{- $prometheusUrl := .Values.app.env.PROMETHEUS_BASE_URL }}
            {{- if not $prometheusUrl }}
            {{- $prometheusUrl = printf "http://%s-prometheus-server:80/api/v1" .Values.monitoring.releaseName }}
            {{- end }}
            - name: PROMETHEUS_BASE_URL
              value: "{{ $prometheusUrl }}"
            - name: ENABLE_DEPLOYMENT_SCHEDULER
              value: "{{ .Values.app.env.ENABLE_DEPLOYMENT_SCHEDULER }}"

            # Grid capacity polling. The poller only starts when both this is
            # "true" and GRID_API_URL below is non-empty (see app/main.py).
            - name: ENABLE_GRID_POLLING
              value: "{{ .Values.app.env.ENABLE_GRID_POLLING }}"
            {{- $gridUrl := .Values.app.env.GRID_API_URL }}
            {{- if and (not $gridUrl) .Values.gridStub.enabled }}
            {{- $gridUrl = "http://grid-stub/capacity" }}
            {{- end }}
            {{- if $gridUrl }}
            - name: GRID_API_URL
              value: "{{ $gridUrl }}"
            {{- end }}
            - name: GRID_POLL_INTERVAL_SECONDS
              value: "{{ .Values.app.env.GRID_POLL_INTERVAL_SECONDS }}"

            # Supply forecasting. Runs in-process, no URL needed.
            - name: ENABLE_FORECASTING
              value: "{{ .Values.app.env.ENABLE_FORECASTING }}"
            - name: FORECASTING_INTERVAL_SECONDS
              value: "{{ .Values.app.env.FORECASTING_INTERVAL_SECONDS }}"

            # Metrics retention cleanup.
            - name: ENABLE_METRICS_RETENTION
              value: "{{ .Values.app.env.ENABLE_METRICS_RETENTION }}"
            - name: METRICS_RETENTION_DAYS
              value: "{{ .Values.app.env.METRICS_RETENTION_DAYS }}"
            - name: METRICS_RETENTION_INTERVAL_SECONDS
              value: "{{ .Values.app.env.METRICS_RETENTION_INTERVAL_SECONDS }}"

            - name: LOG_LEVEL
              value: "{{ .Values.app.env.LOG_LEVEL }}"
            - name: USE_KUBECTL_PROXY
              value: "{{ .Values.app.env.USE_KUBECTL_PROXY }}"
            
            # Kubernetes namespace
            {{- if .Values.app.env.KUBERNETES_NAMESPACE }}
            - name: KUBERNETES_NAMESPACE
              value: "{{ .Values.app.env.KUBERNETES_NAMESPACE }}"
            {{- else }}
            - name: KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace }}
            {{- end }}
          
          readinessProbe:
            httpGet:
              path: /docs
              port: {{ .Values.app.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /docs
              port: {{ .Values.app.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}


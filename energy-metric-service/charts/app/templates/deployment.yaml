apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
    version: {{ .Values.app.image.tag | default "latest" }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        version: {{ .Values.app.image.tag | default "latest" }}
    spec:
      serviceAccountName: {{ .Values.app.name }}-sa
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.targetPort }}
              protocol: TCP
          env:
            # Database connection
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.database.username }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            
            # Application settings
            - name: ENABLE_METRICS_SCHEDULER
              value: "{{ .Values.app.env.ENABLE_METRICS_SCHEDULER }}"
            - name: ENABLE_DEPLOYMENT_SCHEDULER
              value: "{{ .Values.app.env.ENABLE_DEPLOYMENT_SCHEDULER }}"
            - name: ENABLE_OPERATOR
              value: "{{ .Values.app.env.ENABLE_OPERATOR }}"
            - name: LOG_LEVEL
              value: "{{ .Values.app.env.LOG_LEVEL }}"
            
            # Kubernetes namespace
            {{- if .Values.app.env.KUBERNETES_NAMESPACE }}
            - name: KUBERNETES_NAMESPACE
              value: "{{ .Values.app.env.KUBERNETES_NAMESPACE }}"
            {{- else }}
            - name: KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace }}
            {{- end }}
          
          readinessProbe:
            httpGet:
              path: /docs
              port: {{ .Values.app.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /docs
              port: {{ .Values.app.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}


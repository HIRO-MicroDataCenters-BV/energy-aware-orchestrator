[project]
name = "energy-metric-service"
version = "0.1.0"
description = "Energy-aware metrics collection and forecasting service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "psycopg2-binary",
    "pydantic>=2.11.4",
    "kubernetes>=32.0.1",
    "httpx>=0.28.1",
    "boto3>=1.38.27",
    "aiohttp",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.26.0",
    "pylint>=3.3.7",
]
ml = [
    "jupyter>=1.1.1",
    "notebook>=7.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "ipywidgets>=8.0.0",
    "plotly>=5.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.26.0",
    "pylint>=3.3.7",
]

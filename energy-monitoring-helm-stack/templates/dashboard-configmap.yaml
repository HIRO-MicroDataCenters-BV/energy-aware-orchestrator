apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  kepler-dashboard.json: |
{{ .Files.Get "dashboards/kepler-dashboard.json" | indent 4 }}
  pod-node-energy-dashboard.json: |
{{ .Files.Get "dashboards/pod-node-energy-dashboard.json" | indent 4 }}
  kepler-container-energy-dashboard.json: |
{{ .Files.Get "dashboards/kepler-container-energy-dashboard.json" | indent 4 }}
  node-container-metrics-dashboard.json: |
{{ .Files.Get "dashboards/node-container-metrics-dashboard.json" | indent 4 }}
  node-metrics-dashboard.json: |
{{ .Files.Get "dashboards/node-metrics-dashboard.json" | indent 4 }}
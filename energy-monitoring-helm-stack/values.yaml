# Default values for energy-metrics.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

grafana:
  service:
    type: NodePort
    nodePort: 32000
  adminPassword: admin
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://energy-metrics-prometheus-server:80
        access: proxy
        isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

prometheus:
  prometheus-node-exporter:
    enabled: false
  server:
    service:
      type: NodePort
      nodePort: 32001
    persistentVolume:
      enabled: true
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 50Gi
    retention: "45d"
  extraScrapeConfigs: |
    - job_name: 'kepler'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - energy-metrics
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: energy-metrics-kepler
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
    
    - job_name: 'cadvisor'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - energy-metrics
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: energy-metrics-cadvisor
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
      scrape_interval: 15s
      scrape_timeout: 10s
      metrics_path: /metrics
    
    - job_name: 'node-exporter'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - energy-metrics
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: energy-metrics-prometheus-node-exporter
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http-metrics

cadvisor:
  # Enable cAdvisor for container CPU and memory metrics
  enabled: true
  image:
    repository: gcr.io/cadvisor/cadvisor
    tag: "v0.47.2"
    pullPolicy: IfNotPresent
  
  # cAdvisor requires privileged access to collect container metrics
  securityContext:
    privileged: true
  
  # Resource configuration for cAdvisor
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  
  # cAdvisor service configuration
  service:
    type: ClusterIP
    port: 8080
    name: cadvisor
  
  # Host network and PID access for container monitoring
  hostNetwork: false
  hostPID: true
  
  # Volume mounts for container metrics access
  volumeMounts:
    - name: rootfs
      mountPath: /rootfs
      readOnly: true
    - name: var-run
      mountPath: /var/run
      readOnly: false
    - name: sys
      mountPath: /sys
      readOnly: true
    - name: cgroup
      mountPath: /sys/fs/cgroup
      readOnly: true
  
  volumes:
    - name: rootfs
      hostPath:
        path: /
        type: Directory
    - name: var-run
      hostPath:
        path: /var/run
        type: Directory
    - name: sys
      hostPath:
        path: /sys
        type: Directory
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
        type: Directory
  
  # cAdvisor configuration
  args:
    - --housekeeping_interval=30s
    - --max_housekeeping_interval=35s
    - --event_storage_event_limit=default=0
    - --event_storage_age_limit=default=0
    - --disable_metrics=tcp,udp,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,network,perf_event,process
    - --docker_only=false
    - --store_container_labels=false

kepler:
  image:
    repository: quay.io/sustainable_computing_io/kepler
    tag: "release-0.8.0"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Add node selector to run on AMD64 nodes if available
  nodeSelector: {}
  # Add tolerations if needed
  tolerations: []
  # Configure to work with ARM64 emulation
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"

prometheus-node-exporter:
  # Enable node-exporter for node-level system metrics
  enabled: true
  service:
    port: 9100
    targetPort: 9100
    name: http-metrics
  serviceAccount:
    create: true
    name: ""
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"

# Default values for energy-metrics.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

grafana:
  service:
    type: NodePort
    nodePort: 32000
  adminPassword: admin
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://energy-metrics-prometheus-server:80
        access: proxy
        isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

prometheus:
  prometheus-node-exporter:
    enabled: false
  server:
    service:
      type: NodePort
      nodePort: 32001
    persistentVolume:
      enabled: true
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 50Gi
    retention: "45d"
  # names below must match NAMESPACE in the deploy scripts, not the chart's
  # release name ("energy-metrics").
  extraScrapeConfigs: |
    - job_name: 'kepler'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - default
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: energy-metrics-kepler
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http

    - job_name: 'node-exporter'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - default
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: energy-metrics-prometheus-node-exporter
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http-metrics

kepler:
  image:
    repository: quay.io/sustainable_computing_io/kepler
    tag: "release-0.8.0"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Add node selector to run on AMD64 nodes if available
  nodeSelector: {}
  # Add tolerations if needed
  tolerations: []
  # Configure to work with ARM64 emulation
  # Memory limit was 128Mi - pods sat pinned at ~125-127Mi and got OOMKilled
  # roughly every 7-8 minutes (confirmed via `kubectl top` and `describe pod`
  # showing Reason: OOMKilled, Exit Code: 137). Bumped with real headroom.
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

prometheus-node-exporter:
  # Enable node-exporter for node-level system metrics
  enabled: true
  service:
    port: 9100
    targetPort: 9100
    name: http-metrics
  serviceAccount:
    create: true
    name: ""
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"
